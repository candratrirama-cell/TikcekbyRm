<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slow - Simple Deploy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        input, textarea { background: #0a0a0a !important; border: 1px solid #222 !important; color: white !important; outline: none; }
        .btn-slow { background: #fff; color: #000; font-weight: 700; transition: 0.2s; border-radius: 8px; }
        .btn-slow:hover { background: #ccc; }
    </style>
</head>
<body>

    <div id="auth-section" class="flex items-center justify-center min-h-screen p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-sm shadow-2xl border-t-4 border-blue-500">
            <h1 class="text-4xl font-black tracking-tighter mb-2 text-center text-blue-500">SLOW</h1>
            <p class="text-gray-500 text-[10px] text-center mb-8 tracking-[0.2em] uppercase">Private Deployment</p>
            <div class="space-y-3">
                <input type="text" id="username" placeholder="Username" class="w-full p-3 rounded-xl text-sm">
                <input type="password" id="password" placeholder="Password" class="w-full p-3 rounded-xl text-sm">
                <button onclick="handleAuth()" class="w-full btn-slow py-3 mt-2">Masuk / Daftar</button>
            </div>
        </div>
    </div>

    <div id="deploy-section" class="hidden max-w-6xl mx-auto py-10 px-6">
        <div class="flex justify-between items-end mb-10">
            <div>
                <h2 class="text-3xl font-bold italic text-blue-500">Slow/Dashboard</h2>
                <p id="user-display" class="text-xs font-mono text-gray-400"></p>
            </div>
            <button onclick="location.reload()" class="text-xs opacity-50 hover:opacity-100">Logout</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="space-y-6">
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-sm font-bold mb-4 uppercase text-gray-400">Deploy Baru</h3>
                    <input type="text" id="project-name" placeholder="slug-project" class="w-full p-3 rounded-xl mb-3 text-sm">
                    <button onclick="handleDeploy()" class="w-full btn-slow py-3">Deploy</button>
                </div>

                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-sm font-bold mb-4 uppercase text-gray-400">Project Saya</h3>
                    <div id="my-projects-list" class="space-y-2 text-sm overflow-y-auto max-h-60">
                        <p class="text-gray-600 italic">Belum ada project...</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 glass rounded-2xl overflow-hidden flex flex-col">
                <div class="bg-white/5 p-3 text-xs font-mono flex justify-between">
                    <span>index.html</span>
                    <span class="text-blue-400">Auto-save off</span>
                </div>
                <textarea id="project-code" rows="20" placeholder="Ketik HTML di sini..." class="w-full p-6 font-mono text-xs leading-relaxed resize-none bg-transparent"></textarea>
            </div>
        </div>
    </div>

    <div id="view-section" class="fixed inset-0 bg-white hidden z-[9999]">
        <iframe id="output-frame" class="w-full h-full border-none"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAa1YQqXXUn3ssriyyhl6mYHo47-rOcnmg",
            authDomain: "tools-ab6a6.firebaseapp.com",
            databaseURL: "https://tools-ab6a6-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tools-ab6a6",
            appId: "1:1052074462643:web:b5cc8c3083889dfe514fc6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.handleAuth = async () => {
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            if(!user || !pass) return alert("Lengkapi data!");

            const userRef = ref(db, 'users/' + user);
            const snapshot = await get(userRef);

            if (snapshot.exists()) {
                if(snapshot.val().password === pass) { loginSuccess(user); } 
                else { alert("Password salah!"); }
            } else {
                await set(userRef, { password: pass });
                loginSuccess(user);
            }
        };

        function loginSuccess(user) {
            localStorage.setItem('slow_user', user);
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('deploy-section').classList.remove('hidden');
            document.getElementById('user-display').innerText = `@${user}`;
            loadMyProjects(user);
        }

        async function loadMyProjects(user) {
            const snap = await get(ref(db, 'deploys'));
            const listDiv = document.getElementById('my-projects-list');
            listDiv.innerHTML = '';
            
            if (snap.exists()) {
                Object.entries(snap.val()).forEach(([name, data]) => {
                    if(data.author === user) {
                        const link = `${window.location.origin}/#${name}`;
                        listDiv.innerHTML += `
                            <div class="p-2 border border-white/5 rounded-lg flex justify-between items-center">
                                <a href="${link}" target="_blank" class="text-blue-400 truncate mr-2">${name}</a>
                                <span class="text-[10px] opacity-30">Live</span>
                            </div>`;
                    }
                });
            }
        }

        window.handleDeploy = async () => {
            const name = document.getElementById('project-name').value.trim().replace(/\s+/g, '-').toLowerCase();
            const code = document.getElementById('project-code').value;
            const user = localStorage.getItem('slow_user');

            if(!name || !code) return alert("Nama & Kode wajib!");

            await set(ref(db, 'deploys/' + name), { code, author: user });
            alert("Deployed!");
            loadMyProjects(user);
        };

        async function checkRoute() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                const snap = await get(ref(db, 'deploys/' + hash));
                if (snap.exists()) {
                    document.body.innerHTML = `<iframe srcdoc="${snap.val().code.replace(/"/g, '&quot;')}" style="width:100vw;height:100vh;border:none;"></iframe>`;
                }
            }
        }
        window.onload = checkRoute;
    </script>
</body>
</html>
