<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Vercel Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', -apple-system, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        input, textarea { background: #0a0a0a !important; border: 1px solid #222 !important; color: white !important; outline: none; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #0070f3 !important; box-shadow: 0 0 10px rgba(0, 112, 243, 0.2); }
        .btn-deploy { background: #fff; color: #000; font-weight: 700; transition: 0.2s; }
        .btn-deploy:hover { background: #eaeaea; transform: translateY(-1px); }
        /* Hilangkan scrollbar tapi tetep bisa scroll */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen">

    <div id="auth-section" class="flex items-center justify-center min-h-screen p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-sm shadow-2xl">
            <div class="mb-8 text-center">
                <h1 class="text-3xl font-black tracking-tighter">VERCEL <span class="text-blue-500">CLONE</span></h1>
                <p class="text-gray-500 text-xs mt-2 uppercase tracking-widest">Database Powered by Firebase</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="username" placeholder="Username" class="w-full p-3 rounded-xl text-sm">
                <input type="password" id="password" placeholder="Password" class="w-full p-3 rounded-xl text-sm">
                <button onclick="handleAuth()" class="w-full btn-deploy py-3 rounded-xl shadow-lg shadow-white/5">Masuk / Daftar</button>
            </div>
        </div>
    </div>

    <div id="deploy-section" class="hidden max-w-5xl mx-auto py-12 px-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-10">
            <div>
                <h2 class="text-2xl font-bold tracking-tight">Dashboard Deployment</h2>
                <p id="user-display" class="text-sm text-blue-400 font-mono mt-1"></p>
            </div>
            <button onclick="location.reload()" class="text-xs border border-gray-800 px-4 py-2 rounded-lg hover:bg-white/5 transition">Keluar / Refresh</button>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="glass p-6 rounded-2xl">
                    <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2 font-black">Link Name (Slug)</label>
                    <input type="text" id="project-name" placeholder="nama-website" class="w-full p-3 rounded-xl mb-4 font-mono text-sm">
                    
                    <button onclick="handleDeploy()" class="w-full btn-deploy py-4 rounded-xl text-md">
                        Deploy Sekarang
                    </button>
                </div>

                <div id="result-link" class="hidden p-5 bg-blue-500/10 border border-blue-500/30 rounded-2xl animate-pulse">
                    <p class="text-xs text-blue-300 mb-2 font-bold uppercase tracking-tight">Deploy Berhasil!</p>
                    <a id="output-url" href="#" class="text-sm text-white underline break-all font-mono"></a>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="glass p-1 rounded-2xl">
                    <div class="flex items-center gap-2 p-3 border-b border-white/5">
                        <div class="w-3 h-3 rounded-full bg-red-500/50"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500/50"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500/50"></div>
                        <span class="text-[10px] text-gray-500 ml-2 font-mono">index.html</span>
                    </div>
                    <textarea id="project-code" rows="18" placeholder="Masukkan kode HTML/CSS/JS di sini..." class="w-full p-4 rounded-b-2xl font-mono text-xs leading-relaxed"></textarea>
                </div>
            </div>
        </div>
    </div>

    <div id="view-section" class="fixed inset-0 bg-white hidden z-[9999]">
        <iframe id="output-frame" class="w-full h-full border-none"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Konfigurasi Firebase tetap pakai milikmu
        const firebaseConfig = {
            apiKey: "AIzaSyAa1YQqXXUn3ssriyyhl6mYHo47-rOcnmg",
            authDomain: "tools-ab6a6.firebaseapp.com",
            databaseURL: "https://tools-ab6a6-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tools-ab6a6",
            storageBucket: "tools-ab6a6.firebasestorage.app",
            messagingSenderId: "1052074462643",
            appId: "1:1052074462643:web:b5cc8c3083889dfe514fc6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- AUTH LOGIC ---
        window.handleAuth = async () => {
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            if(!user || !pass) return alert("Isi Username dan Password!");

            const userRef = ref(db, 'users/' + user);
            const snapshot = await get(userRef);

            if (snapshot.exists()) {
                if(snapshot.val().password === pass) {
                    showDashboard(user);
                } else {
                    alert("Password salah bro!");
                }
            } else {
                await set(userRef, { password: pass });
                alert("Akun baru didaftarkan!");
                showDashboard(user);
            }
        };

        function showDashboard(user) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('deploy-section').classList.remove('hidden');
            document.getElementById('user-display').innerText = `active_user: ${user}`;
            localStorage.setItem('session_user', user);
        }

        // --- DEPLOY LOGIC ---
        window.handleDeploy = async () => {
            const name = document.getElementById('project-name').value.trim().replace(/\s+/g, '-').toLowerCase();
            const code = document.getElementById('project-code').value;

            if(!name || !code) return alert("Nama dan Kode harus ada!");

            await set(ref(db, 'deploys/' + name), { 
                code: code,
                author: localStorage.getItem('session_user') || 'anonymous'
            });

            // Menyesuaikan URL secara otomatis sesuai domain aktif
            const dynamicUrl = `${window.location.protocol}//${window.location.host}/#${name}`;
            const resultBox = document.getElementById('result-link');
            const linkTag = document.getElementById('output-url');
            
            resultBox.classList.remove('hidden');
            linkTag.href = dynamicUrl;
            linkTag.innerText = dynamicUrl;
        };

        // --- ROUTING SYSTEM ---
        async function checkRoute() {
            const hash = window.location.hash.substring(1); 
            
            if (hash && hash !== "" && !hash.includes('access_token')) {
                const snapshot = await get(ref(db, 'deploys/' + hash));
                
                if (snapshot.exists()) {
                    // Sembunyikan semua UI dashboard
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('deploy-section').style.display = 'none';
                    document.getElementById('view-section').classList.remove('hidden');
                    
                    const iframe = document.getElementById('output-frame');
                    // Menggunakan blob agar script di dalam kode user bisa jalan sempurna
                    const blob = new Blob([snapshot.val().code], { type: 'text/html' });
                    iframe.src = URL.createObjectURL(blob);
                }
            }
        }

        window.addEventListener('hashchange', () => window.location.reload());
        window.onload = checkRoute;
    </script>
</body>
</html>
